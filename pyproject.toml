[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathercloud"
dynamic = ["version"]
description = "Unofficial Python client for Weathercloud"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mauro Druwel" }]
dependencies = ["requests>=2.28"]
keywords = ["weathercloud", "weather", "api", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
]
dev = [
    "weathercloud[test]",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-requests>=2.28",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/MauroDruwel/Weathercloud"
Documentation = "https://weathercloud-api.maurodruwel.be"
"Bug Tracker" = "https://github.com/MauroDruwel/Weathercloud/issues"
"Source Code" = "https://github.com/MauroDruwel/Weathercloud"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weathercloud = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "weathercloud.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
packages = ["weathercloud"]
strict = true
warn_unused_ignores = true
