[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathercloud"
version = "0.1.0"
description = "Unofficial Python client for Weathercloud"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]
keywords = ["weathercloud", "weather", "api", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/MauroDruwel/Weathercloud-API"
Documentation = "https://weathercloud-api.maurodruwel.be"
"Bug Tracker" = "https://github.com/MauroDruwel/Weathercloud-API/issues"

[tool.setuptools]
py-modules = ["weathercloud"]
